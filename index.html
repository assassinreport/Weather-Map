<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Organic Weather Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="map"></div>

    <div id="controls" class="windy-panel">
        <div class="panel-header">
            <h3>Climate Finder</h3>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="city-search" placeholder="Search city...">
                <button id="search-btn">Go</button>
            </div>
            <div id="search-error"></div>
        </div>

        <hr class="divider">

        <div class="accordion-item" id="presets-section">
            <div class="accordion-trigger main-trigger-wrapper">
                <button class="main-trigger">
                    <span>Presets</span>
                    <span class="chevron" aria-hidden="true">▼</span>
                </button>
            </div>
            <div class="accordion-content">
                <div class="presets-body">
                    <div class="preset-save-row">
                        <input type="text" id="preset-name" placeholder="Preset name..." maxlength="40" autocomplete="off">
                        <button id="preset-save-btn" type="button">Save</button>
                    </div>
                    <div id="preset-message" role="status"></div>
                    <ul id="preset-list" class="preset-list"></ul>
                </div>
            </div>
        </div>

        <div class="accordion-item active">
            <div class="accordion-trigger main-trigger-wrapper">
                <button class="main-trigger">
                    <span>Temperature Ranges</span>
                    <span class="chevron" aria-hidden="true">▼</span>
                </button>
                <label class="toggle-container">
                    <input type="checkbox" id="ranges-master-enable" class="master-toggle" checked>
                    <span class="checkmark"></span>
                </label>
            </div>
            
            <div class="accordion-content nested-container">
                <div class="sub-accordion active">
                    <div class="sub-accordion-header">
                        <div class="sub-header-left">
                            <label class="toggle-container">
                                <input type="checkbox" id="winter-min-enable" class="sub-toggle" checked>
                                <span class="checkmark"></span>
                            </label>
                            <span class="layer-title">Winter Mins (Night Lows)</span>
                        </div>
                        <span class="sub-chevron" aria-hidden="true">▼</span>
                    </div>
                    <div class="sub-accordion-content">
                        <div class="slider-wrapper">
                            <label>Range: <span id="winter-min-min-val">20</span>°F to <span id="winter-min-max-val">35</span>°F</label>
                            <input type="range" id="winter-min-min" min="-30" max="90" value="20">
                            <input type="range" id="winter-min-max" min="-30" max="90" value="35">
                        </div>
                    </div>
                </div>

                <div class="sub-accordion active">
                    <div class="sub-accordion-header">
                        <div class="sub-header-left">
                            <label class="toggle-container">
                                <input type="checkbox" id="winter-max-enable" class="sub-toggle" checked>
                                <span class="checkmark"></span>
                            </label>
                            <span class="layer-title">Winter Maxes (Day Highs)</span>
                        </div>
                        <span class="sub-chevron" aria-hidden="true">▼</span>
                    </div>
                    <div class="sub-accordion-content">
                        <div class="slider-wrapper">
                            <label>Range: <span id="winter-max-min-val">40</span>°F to <span id="winter-max-max-val">55</span>°F</label>
                            <input type="range" id="winter-max-min" min="-30" max="90" value="40">
                            <input type="range" id="winter-max-max" min="-30" max="90" value="55">
                        </div>
                    </div>
                </div>

                <div class="sub-accordion active">
                    <div class="sub-accordion-header">
                        <div class="sub-header-left">
                            <label class="toggle-container">
                                <input type="checkbox" id="summer-min-enable" class="sub-toggle" checked>
                                <span class="checkmark"></span>
                            </label>
                            <span class="layer-title">Summer Mins (Night Lows)</span>
                        </div>
                        <span class="sub-chevron" aria-hidden="true">▼</span>
                    </div>
                    <div class="sub-accordion-content">
                        <div class="slider-wrapper">
                            <label>Range: <span id="summer-min-min-val">55</span>°F to <span id="summer-min-max-val">70</span>°F</label>
                            <input type="range" id="summer-min-min" min="30" max="125" value="55">
                            <input type="range" id="summer-min-max" min="30" max="125" value="70">
                        </div>
                    </div>
                </div>

                <div class="sub-accordion active">
                    <div class="sub-accordion-header">
                        <div class="sub-header-left">
                            <label class="toggle-container">
                                <input type="checkbox" id="summer-max-enable" class="sub-toggle" checked>
                                <span class="checkmark"></span>
                            </label>
                            <span class="layer-title">Summer Maxes (Day Highs)</span>
                        </div>
                        <span class="sub-chevron" aria-hidden="true">▼</span>
                    </div>
                    <div class="sub-accordion-content">
                        <div class="slider-wrapper">
                            <label>Range: <span id="summer-max-min-val">75</span>°F to <span id="summer-max-max-val">90</span>°F</label>
                            <input type="range" id="summer-max-min" min="30" max="125" value="75">
                            <input type="range" id="summer-max-max" min="30" max="125" value="90">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="accordion-item active">
            <div class="accordion-trigger main-trigger-wrapper">
                <button class="main-trigger">
                    <span>Dew Point / Moisture</span>
                    <span class="chevron" aria-hidden="true">▼</span>
                </button>
                <label class="toggle-container">
                    <input type="checkbox" id="dp-master-enable" class="master-toggle" checked>
                    <span class="checkmark"></span>
                </label>
            </div>
            
            <div class="accordion-content nested-container">
                <div class="sub-accordion active">
                    <div class="sub-accordion-header">
                        <div class="sub-header-left">
                            <label class="toggle-container">
                                <input type="checkbox" id="winter-dp-enable" class="sub-toggle" checked>
                                <span class="checkmark"></span>
                            </label>
                            <span class="layer-title">Winter Dew Point</span>
                        </div>
                        <span class="sub-chevron" aria-hidden="true">▼</span>
                    </div>
                    <div class="sub-accordion-content">
                        <div class="slider-wrapper">
                            <label>Range: <span id="winter-dp-min-val">15</span>°F to <span id="winter-dp-max-val">35</span>°F</label>
                            <input type="range" id="winter-dp-min" min="0" max="90" value="15">
                            <input type="range" id="winter-dp-max" min="0" max="90" value="35">
                        </div>
                    </div>
                </div>

                <div class="sub-accordion active">
                    <div class="sub-accordion-header">
                        <div class="sub-header-left">
                            <label class="toggle-container">
                                <input type="checkbox" id="summer-dp-enable" class="sub-toggle" checked>
                                <span class="checkmark"></span>
                            </label>
                            <span class="layer-title">Summer Dew Point</span>
                        </div>
                        <span class="sub-chevron" aria-hidden="true">▼</span>
                    </div>
                    <div class="sub-accordion-content">
                        <div class="slider-wrapper">
                            <label>Range: <span id="summer-dp-min-val">45</span>°F to <span id="summer-dp-max-val">60</span>°F</label>
                            <input type="range" id="summer-dp-min" min="0" max="90" value="45">
                            <input type="range" id="summer-dp-max" min="0" max="90" value="60">
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div id="map-context-menu" class="map-context-menu" role="menu" hidden>
        <button type="button" id="ctx-coords" class="ctx-coords" role="menuitem" title="Click to copy"></button>
        <hr>
        <button type="button" id="ctx-measure" role="menuitem">Measure distance</button>
        <button type="button" id="ctx-lat" role="menuitem">Draw latitude line</button>
        <button type="button" id="ctx-lng" role="menuitem">Draw longitude line</button>
    </div>

    <div id="tools-bar" class="tools-bar" hidden>
        <span id="tools-readout"></span>
        <button type="button" id="tools-done" hidden>Done</button>
        <button type="button" id="tools-clear">Clear tools</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="globalClimate.js"></script>
</body>
</html>
